name: Run Breeden-Litzenberger Strategy & Update Report

# 1. Triggers
on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  # Allows manual runs via the "Actions" tab in GitHub UI
  workflow_dispatch:

# 2. Permissions required to push commits and publish summaries
permissions:
  contents: write
  actions: read

jobs:
  run-trading-pipeline:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone repository onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install dependencies (pandas, numpy, scipy, yfinance, etc.)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run strategy logic & generate multi-format reports
      - name: Run Trading Pipeline & Generate Reports
        run: |
          python dynamic_trader_v2.py
          python status.py

      # Step 5: Render In-Browser GitHub Actions Step Summary
      - name: Render In-Browser Summary
        if: always()
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          PAGES_URL="https://${OWNER_LOWER}.github.io/${REPO_NAME}/report.html"
          PREVIEW_URL="https://htmlpreview.github.io/?https://github.com/${{ github.repository }}/blob/main/report.html"

          echo "# 📊 Strategy & Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 [👉 Click Here to Open Live HTML Report (GitHub Pages)](${PAGES_URL})" >> $GITHUB_STEP_SUMMARY
          echo "*Alternative link:* [Open via HTML Previewer](${PREVIEW_URL})" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          if [ -f report.md ]; then
            cat report.md >> $GITHUB_STEP_SUMMARY
          fi

      # Step 6: Upload Reports and Data as Workflow Artifacts
      - name: Upload Strategy Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-bot-performance-report
          path: |
            report.html
            report.md
            report.txt
            dynamic_trades_2.0.csv
          retention-days: 30
          if-no-files-found: warn

      # Step 7: Commit updated CSV state & all reports back to repository
      - name: Commit and Push State & Reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: update trade state & strategy reports [skip ci]"
          file_pattern: "report.txt report.md report.html dynamic_trades_2.0.csv"
