name: Run Breeden-Litzenberger Strategy & Update Report

# 1. Triggers
on:
  schedule:
    # Runs every day at 00:00 UTC (Adjust cron syntax as needed)
    - cron: '0 0 * * *'
  # Allows manual runs via the "Actions" tab in GitHub UI
  workflow_dispatch:

# 2. Permissions required to push commits back to the repo
permissions:
  contents: write

jobs:
  run-trading-pipeline:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone repository onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies (pandas, numpy, scipy, yfinance, etc.)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run trader logic & pipe status check output to report.txt
      - name: Run Trading Pipeline & Generate Report
        run: |
          python dynamic_trader_v2.py
          python status.py > report.txt

      # Step 5: Commit both the updated CSV state & report.txt back to repo
      - name: Commit and Push State & Report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: update trade state & strategy report [skip ci]"
          file_pattern: "report.txt dynamic_trades_2.0.csv"
